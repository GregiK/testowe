name: Build i wdrożenie na Aderlo Cloud

# Ten workflow buduje całą aplikację tutaj (npm ci, testy, prisma generate, next build) -
# hosting współdzielony nie buduje niczego, tylko serwuje gotowe pliki. Gotowy, kompletny
# pakiet (kod + node_modules produkcyjne + .next) trafia jako commit na osobną gałąź
# "deploy". Faktyczne wdrożenie na serwer Aderlo odbywa się RĘCZNIE, przez Terminal
# (SSH) w panelu Aderlo - `bash deploy.sh` (skrypt na serwerze pobiera tę gałąź i
# podmienia pliki). Automatyczna wysyłka przez API Menedżera Plików Aderlo była
# testowana (2026-08-23), ale ten panel udostępnia wyłącznie tokeny MCP, nie prosty
# klucz API kompatybilny z curl/Basic Auth z poziomu GitHub Actions - plan porzucony,
# patrz docs/assumptions.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instaluj wszystkie zależności (potrzebne do builda, w tym devDependencies)
        run: npm ci

      - name: Wygeneruj klienta Prisma (silniki pod GitHub Actions i pod serwer Aderlo)
        run: npx prisma generate

      - name: Uruchom testy automatyczne (logika domenowa - hasła, walidacje, wiek)
        run: npm test

      - name: Zbuduj aplikację (webpack - zgodnie z ograniczeniami procesów na hostingu docelowym)
        run: npx next build --webpack

      - name: Usuń zależności deweloperskie (mniejszy, czysto produkcyjny node_modules)
        run: npm prune --omit=dev

      - name: Złóż kompletny pakiet do wdrożenia
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package
          cp -r .next deploy-package/
          cp -r public deploy-package/
          cp -r node_modules deploy-package/
          cp -r prisma deploy-package/
          cp server.js deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/
          cp next.config.ts deploy-package/
          mkdir -p deploy-package/tmp
          date -u > deploy-package/tmp/restart.txt

      - name: Opublikuj pakiet na gałęzi "deploy"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-package
          publish_branch: deploy
          force_orphan: true
          commit_message: "Wdrożenie: build ${{ github.sha }}"

      # Faktyczne wdrożenie na serwer (pobranie tej gałęzi i podmiana plików) odbywa się
      # ręcznie przez Terminal w panelu Aderlo: `bash deploy.sh`. Patrz docs/assumptions.md.
