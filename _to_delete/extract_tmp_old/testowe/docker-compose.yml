# Wyłącznie do lokalnego developmentu. Produkcja działa na Aderlo Cloud (cPanel,
# Setup Node.js App / Passenger) i korzysta z zarządzanej bazy MySQL panelu hostingowego,
# a nie z tego docker-compose. Patrz docs/implementation-plan.md, sekcja Deployment.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dating_app_dev
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
